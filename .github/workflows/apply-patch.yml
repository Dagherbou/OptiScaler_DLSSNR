name: Apply a patch file

# Applies a .patch sitting in the repo root, commits the result, and deletes the patch.
# For landing a large change from a phone, where git apply is not available.
#
# Upload the .patch to the repo root, then run this and give it the file name.
#
# Needs Settings > Actions > General > Workflow permissions set to "Read and write permissions".

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch file in the repo root"
        required: true
        default: "upstream-merge.patch"
      message:
        description: "Commit message"
        required: true
        default: "Merge upstream Vulkan and exposure work; fix Paper white ceiling"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch this was launched from
        uses: actions/checkout@v4

      - name: Check the patch is there and would apply
        run: |
          if [ ! -f "${{ inputs.patch }}" ]; then
            echo "::error::${{ inputs.patch }} is not in the repo root. Upload it first."
            exit 1
          fi

          # --check first: a patch that half-applies is worse than one that does not apply at all.
          git apply --check --binary "${{ inputs.patch }}"
          echo "Patch verified — it applies cleanly."

      - name: Apply it
        run: |
          git apply --binary "${{ inputs.patch }}"
          rm -f "${{ inputs.patch }}"

          echo "Changed files:"
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing changed — the patch was empty or already applied."
            exit 0
          fi

          git add -A
          git commit -m "${{ inputs.message }}"
          git push
